<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg-1: #4f46e5;
      --bg-2: #06b6d4;
      --bg-3: #8b5cf6;
      --text: #ffffff;
      --muted: #e5e7eb;
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.2);
      --input-bg: rgba(255, 255, 255, 0.18);
      --line: rgba(255, 255, 255, 0.3);
      --primary: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Poppins, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-2), var(--bg-3));
      background-size: 300% 300%;
      animation: bgShift 12s ease-in-out infinite;
      padding: 16px;
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .card {
      width: min(420px, 100%);
      padding: 40px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      font-size: 34px;
    }

    .title {
      margin: 20px 0 8px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 30px;
      text-align: center;
      opacity: 0.9;
    }

    .field {
      margin-bottom: 18px;
      position: relative;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--muted);
    }

    .input {
      width: 100%;
      padding: 15px 48px 15px 16px;
      border: none;
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
    }

    .input::placeholder {
      color: #f3f4f6;
    }

    .input:focus {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 2px;
    }

    .toggle-btn {
      position: absolute;
      right: 12px;
      top: 38px;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      padding: 4px 6px;
      border-radius: 8px;
    }

    .toggle-btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.5);
      outline-offset: 2px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    a {
      color: var(--text);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 16px;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: #fff;
      color: var(--primary);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      color: var(--text);
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .divider span {
      padding: 0 12px;
      font-size: 14px;
    }

    .social {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-social {
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="card" role="main" aria-labelledby="loginTitle">
    <div class="logo" aria-hidden="true">🔐</div>

    <h1 id="loginTitle" class="title">Welcome Back to Site</h1>
    <p class="subtitle">Sign in to your account</p>

    <form action="#" method="post" novalidate>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input
          class="input"
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label class="label" for="pwd">Password</label>
        <input
          class="input"
          id="pwd"
          name="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
        <button
          type="button"
          class="toggle-btn"
          id="togglePwd"
          aria-label="Show password"
          aria-controls="pwd"
          aria-pressed="false"
        >
          👁️
        </button>
      </div>

      <div class="row">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          <span>Remember me</span>
        </label>
        <a href="#" aria-label="Reset forgotten password">Forgot Password?</a>
      </div>

      <button class="btn btn-primary" type="submit">Sign In</button>

      <div class="divider" aria-hidden="true"><span>OR</span></div>

      <div class="social">
        <button class="btn btn-social" type="button" aria-label="Sign in with Google">🌐 Google</button>
        <button class="btn btn-social" type="button" aria-label="Sign in with GitHub">🐙 GitHub</button>
      </div>

      <p class="footer">
        Don't have an account?
        <a href="#">Create an Account</a>
      </p>
    </form>
  </main>

  <script>
    const toggleBtn = document.getElementById("togglePwd");
    const passwordInput = document.getElementById("pwd");

    toggleBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleBtn.setAttribute("aria-pressed", String(isPassword));
      toggleBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    });
  </script>
</body>
</html>
