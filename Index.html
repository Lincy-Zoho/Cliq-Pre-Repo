<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#4f46e5,#06b6d4,#8b5cf6);background-size:300% 300%;animation:bg 12s infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.card{width:420px;max-width:92%;padding:40px;border-radius:24px;background:rgba(255,255,255,.12);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{width:80px;height:80px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;font-size:34px}
h2,p{text-align:center;color:#fff}h2{margin:20px 0 8px}p{opacity:.9;margin-bottom:30px}
.field{margin-bottom:18px;position:relative}
input{width:100%;padding:15px 48px 15px 16px;border:none;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;font-size:15px}
input::placeholder{color:#eee}input:focus{outline:2px solid rgba(255,255,255,.4)}
.eye{position:absolute;right:16px;top:50%;transform:translateY(-50%);cursor:pointer}
.row{display:flex;justify-content:space-between;color:#fff;font-size:14px;margin-bottom:22px}
a{color:#fff;text-decoration:none}
button{width:100%;padding:15px;border:none;border-radius:12px;background:#fff;color:#4f46e5;font-weight:700;font-size:16px;cursor:pointer;transition:.25s}
button:hover{transform:translateY(-2px)}
.div{display:flex;align-items:center;color:#fff;margin:24px 0}.div:before,.div:after{content:"";flex:1;height:1px;background:rgba(255,255,255,.3)}.div span{padding:0 12px}
.social{display:grid;grid-template-columns:1fr 1fr;gap:12px}.social button{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.2)}
.footer{text-align:center;color:#fff;margin-top:24px}
</style>
</head>
<body>
<div class="card">
<div class="logo">🔐</div>
<h2>Welcome Back to Site</h2>
<p>Sign in to your account</p>
<form>
<div class="field"><input type="email" placeholder="Email" required></div>
<div class="field"><input id="pwd" type="password" placeholder="Password" required><span class="eye" onclick="toggle()">👁️</span></div>
<div class="row"><label><input type="checkbox"> Remember me</label><a href="#">Forgot Password?</a></div>
<button>Sign In</button>
<div class="div"><span>OR</span></div>
<div class="social"><button type="button">🌐 Google</button><button type="button">🐙 GitHub</button></div>
<div class="footer">Don't have an account? <a href="#">Create an Account</a></div>
</form>
</div>
<script>
function toggle(){const p=document.getElementById('pwd');p.type=p.type==='password'?'text':'password';}
</script>
</body></html>
