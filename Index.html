<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: "Poppins", sans-serif;
            background:
                radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 30%),
                linear-gradient(135deg, #4f46e5, #06b6d4, #8b5cf6);
            background-size: 200% 200%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0%, 100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .login-card {
            width: 430px;
            max-width: 100%;
            padding: 42px;
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 28px;
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 70px rgba(0,0,0,.25);
        }

        /* Logo */
        .logo {
            width: 76px;
            height: 76px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: rgba(255,255,255,.95);
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,.15);
        }

        .title {
            margin-top: 22px;
            text-align: center;
            color: #fff;
            font-size: 26px;
            font-weight: 600;
        }

        .subtitle {
            margin-top: 7px;
            margin-bottom: 30px;
            text-align: center;
            color: rgba(255,255,255,.82);
            font-size: 13px;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            height: 52px;
            padding: 0 48px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 13px;
            outline: none;
            background: rgba(255,255,255,.16);
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: .2s ease;
        }

        .form-input::placeholder {
            color: rgba(255,255,255,.75);
        }

        .form-input:focus {
            border-color: rgba(255,255,255,.55);
            background: rgba(255,255,255,.22);
            box-shadow: 0 0 0 3px rgba(255,255,255,.08);
        }

        .form-input:invalid:not(:placeholder-shown) {
            border-color: rgba(255,120,120,.8);
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            padding: 4px;
            border: 0;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 17px;
        }

        .password-toggle:focus-visible {
            outline: 2px solid rgba(255,255,255,.7);
            border-radius: 5px;
        }

        /* Password strength */
        .password-strength {
            display: none;
            margin-top: 9px;
        }

        .strength-bar {
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 10px;
            background: rgba(255,255,255,.18);
        }

        .strength-progress {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: #fff;
            transition: width .3s ease;
        }

        .strength-text {
            display: block;
            margin-top: 5px;
            color: rgba(255,255,255,.8);
            font-size: 11px;
        }

        .caps-warning {
            display: none;
            margin-top: 7px;
            color: #fff;
            font-size: 11px;
        }

        /* Options */
        .options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 22px 0;
            color: #fff;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .remember input {
            width: 15px;
            height: 15px;
            accent-color: #fff;
            cursor: pointer;
        }

        .options a {
            color: #fff;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            height: 50px;
            border-radius: 13px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .25s ease;
        }

        .login-btn {
            border: none;
            background: #fff;
            color: #4f46e5;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,.2);
        }

        .login-btn:disabled {
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            border: 1px solid rgba(255,255,255,.3);
            background: rgba(255,255,255,.1);
            color: #fff;
        }

        .clear-btn:hover {
            background: rgba(255,255,255,.22);
        }

        /* Message */
        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 9px;
            background: rgba(34,197,94,.22);
            color: #fff;
            text-align: center;
            font-size: 12px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: rgba(255,255,255,.75);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,.25);
        }

        /* Social buttons */
        .social-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .social-btn {
            height: 46px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            background: rgba(255,255,255,.12);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            transition: .25s ease;
        }

        .social-btn:hover {
            background: rgba(255,255,255,.24);
            transform: translateY(-2px);
        }

        /* Footer */
        .signup {
            margin-top: 24px;
            text-align: center;
            color: rgba(255,255,255,.8);
            font-size: 12px;
        }

        .signup a {
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }

        .signup a:hover {
            text-decoration: underline;
        }

        .copyright {
            margin-top: 18px;
            text-align: center;
            color: rgba(255,255,255,.55);
            font-size: 10px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .login-card {
                padding: 30px 22px;
                border-radius: 22px;
            }

            .title {
                font-size: 22px;
            }

            .button-group,
            .social-buttons {
                grid-template-columns: 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }

            * {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <main class="login-card">

        <div class="logo" aria-hidden="true">
            🔐
        </div>

        <h1 class="title">Welcome Back 👋</h1>

        <p class="subtitle">
            Sign in to continue to your account
        </p>

        <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="form-group">
                <div class="input-wrapper">

                    <span class="input-icon" aria-hidden="true">
                        📧
                    </span>

                    <input
                        class="form-input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email address"
                        autocomplete="email"
                        aria-label="Email address"
                        required
                    >

                </div>
            </div>

            <!-- Password -->
            <div class="form-group">

                <div class="input-wrapper">

                    <span class="input-icon" aria-hidden="true">
                        🔒
                    </span>

                    <input
                        class="form-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        aria-label="Password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                        aria-pressed="false"
                    >
                        👁️
                    </button>

                </div>

                <!-- Password strength -->
                <div
                    class="password-strength"
                    id="passwordStrength"
                >
                    <div class="strength-bar">
                        <div
                            class="strength-progress"
                            id="strengthProgress"
                        ></div>
                    </div>

                    <span
                        class="strength-text"
                        id="strengthText"
                    >
                        Password strength
                    </span>
                </div>

                <!-- Caps Lock -->
                <div
                    class="caps-warning"
                    id="capsWarning"
                    role="alert"
                >
                    ⚠️ Caps Lock is ON
                </div>

            </div>

            <!-- Options -->
            <div class="options">

                <label class="remember">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >
                    <span>Remember me</span>
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>

            <!-- Buttons -->
            <div class="button-group">

                <button
                    type="submit"
                    class="btn login-btn"
                    id="loginBtn"
                >
                    Sign In
                </button>

                <button
                    type="button"
                    class="btn clear-btn"
                    id="clearBtn"
                >
                    Clear
                </button>

            </div>

            <!-- Success message -->
            <div
                class="message"
                id="successMessage"
                role="status"
                aria-live="polite"
            >
                ✅ Sign-in successful!
            </div>

            <!-- Divider -->
            <div class="divider">
                <span>OR</span>
            </div>

            <!-- Social login -->
            <div class="social-buttons">

                <button
                    type="button"
                    class="social-btn"
                >
                    🌐 Google
                </button>

                <button
                    type="button"
                    class="social-btn"
                >
                    🐙 GitHub
                </button>

            </div>

            <!-- Sign up -->
            <div class="signup">
                Don't have an account?
                <a href="#">
                    Create an Account
                </a>
            </div>

            <div class="copyright">
                © 2026 Your Application. All rights reserved.
            </div>

        </form>

    </main>

    <script>
        const form = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const passwordToggle = document.getElementById("passwordToggle");
        const passwordStrength = document.getElementById("passwordStrength");
        const strengthProgress = document.getElementById("strengthProgress");
        const strengthText = document.getElementById("strengthText");
        const capsWarning = document.getElementById("capsWarning");
        const loginButton = document.getElementById("loginBtn");
        const clearButton = document.getElementById("clearBtn");
        const successMessage = document.getElementById("successMessage");

        /* Password visibility */
        passwordToggle.addEventListener("click", () => {
            const showPassword = password.type === "password";

            password.type = showPassword ? "text" : "password";

            passwordToggle.textContent = showPassword ? "🙈" : "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                showPassword ? "Hide password" : "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                String(showPassword)
            );
        });

        /* Keyboard support */
        passwordToggle.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                passwordToggle.click();
            }
        });

        /* Password strength */
        password.addEventListener("input", () => {
            const value = password.value;

            if (!value) {
                passwordStrength.style.display = "none";
                return;
            }

            passwordStrength.style.display = "block";

            let score = 0;

            if (value.length >= 6) score++;
            if (value.length >= 10) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            const percentage = Math.min(score * 20, 100);

            strengthProgress.style.width = `${percentage}%`;

            if (score <= 2) {
                strengthText.textContent = "Weak password";
            } else if (score <= 3) {
                strengthText.textContent = "Medium password";
            } else {
                strengthText.textContent = "Strong password";
            }
        });

        /* Caps Lock detection */
        password.addEventListener("keyup", (event) => {
            const capsLockOn =
                event.getModifierState &&
                event.getModifierState("CapsLock");

            capsWarning.style.display =
                capsLockOn ? "block" : "none";
        });

        /* Clear form */
        clearButton.addEventListener("click", () => {
            form.reset();

            passwordStrength.style.display = "none";
            capsWarning.style.display = "none";
            successMessage.style.display = "none";

            password.type = "password";

            passwordToggle.textContent = "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                "false"
            );

            email.focus();
        });

        /* Form submission */
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            if (!email.checkValidity()) {
                email.focus();
                return;
            }

            if (!password.checkValidity()) {
                password.focus();
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing In...";
            successMessage.style.display = "none";

            setTimeout(() => {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";

                successMessage.style.display = "block";
            }, 1500);
        });
    </script>

</body>
</html>
