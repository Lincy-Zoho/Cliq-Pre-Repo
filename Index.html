<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Login Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(
                135deg,
                #4f46e5,
                #06b6d4,
                #8b5cf6
            );

            background-size: 300% 300%;
            animation: bg 12s ease infinite;
        }

        @keyframes bg {
            0%,
            100% {
                background-position: 0 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        .card {
            width: 420px;
            max-width: 100%;
            padding: 40px;

            border-radius: 24px;

            background: rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #fff;

            font-size: 34px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h2,
        .subtitle {
            text-align: center;
            color: #fff;
        }

        h2 {
            margin: 20px 0 8px;
            font-size: 24px;
        }

        .subtitle {
            opacity: 0.9;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .field {
            margin-bottom: 18px;
            position: relative;
        }

        .field-icon {
            position: absolute;
            left: 16px;
            top: 17px;

            font-size: 17px;
            pointer-events: none;
            z-index: 2;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;

            padding: 15px 48px 15px 45px;

            border: 1px solid transparent;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.18);

            color: #fff;

            font-size: 15px;

            transition:
                background 0.2s,
                border-color 0.2s,
                outline 0.2s;
        }

        input::placeholder {
            color: #eee;
        }

        input:focus {
            outline: none;

            border-color: rgba(255, 255, 255, 0.55);

            background: rgba(255, 255, 255, 0.23);

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.08);
        }

        input.error {
            border-color: rgba(255, 100, 100, 0.9);
            box-shadow:
                0 0 0 3px rgba(255, 100, 100, 0.12);
        }

        .error-message {
            display: none;

            margin-top: 6px;
            padding-left: 4px;

            color: #ffe1e1;

            font-size: 12px;
        }

        .eye {
            position: absolute;

            right: 16px;
            top: 17px;

            cursor: pointer;

            color: #fff;

            user-select: none;

            z-index: 3;
        }

        .eye:focus {
            outline: 2px solid rgba(255, 255, 255, 0.6);

            border-radius: 5px;
        }

        /* Password Strength */

        .password-strength {
            display: none;
            margin-top: 8px;
        }

        .strength-bar {
            width: 100%;

            border-radius: 5px;

            background: rgba(255, 255, 255, 0.2);

            overflow: hidden;
        }

        .strength-progress {
            width: 0;
            height: 100%;

            border-radius: 5px;

            background: #fff;

            transition:
                width 0.3s ease,
                background 0.3s ease;
        }

        .strength-text {
            display: block;

            margin-top: 5px;

            color: rgba(255, 255, 255, 0.85);

            font-size: 11px;
        }

        /* Caps Lock */

        .caps-warning {
            display: none;

            margin-top: 7px;

            color: #fff;

            font-size: 12px;
        }

        /* Options */

        .row {
            display: flex;

            justify-content: space-between;
            align-items: center;

            color: #fff;

            font-size: 14px;

            margin-bottom: 22px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            cursor: pointer;
        }

        .remember input {
            width: 15px;
            height: 15px;

            accent-color: #fff;

            cursor: pointer;
        }

        a {
            color: #fff;

            text-decoration: none;

            transition: 0.2s;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Buttons */

        .button-group {
            display: flex;
            gap: 10px;
        }

        .login-btn,
        .clear-btn {
            flex: 1;

            padding: 15px;

            border-radius: 12px;

            font-weight: 700;

            font-size: 16px;

            cursor: pointer;

            transition: 0.25s;
        }

        .login-btn {
            border: none;

            background: #fff;

            color: #4f46e5;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;

            cursor: not-allowed;
        }

        .clear-btn {
            border: 1px solid rgba(255, 255, 255, 0.3);

            background: rgba(255, 255, 255, 0.12);

            color: #fff;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* Status Message */

        .message {
            display: none;

            margin-top: 15px;

            padding: 10px;

            border-radius: 8px;

            text-align: center;

            color: #fff;

            font-size: 13px;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.25);

            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Divider */

        .div {
            display: flex;

            align-items: center;

            color: #fff;

            margin: 24px 0;
        }

        .div::before,
        .div::after {
            content: "";

            flex: 1;

            height: 1px;

            background: rgba(255, 255, 255, 0.3);
        }

        .div span {
            padding: 0 12px;

            font-size: 13px;
        }

        /* Social Login */

        .social {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .social button {
            width: 100%;

            padding: 13px;

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.18);

            color: #fff;

            border: 1px solid rgba(255, 255, 255, 0.2);

            cursor: pointer;

            font-weight: 500;

            transition: 0.25s;
        }

        .social button:hover {
            background: rgba(255, 255, 255, 0.3);

            transform: translateY(-2px);
        }

        /* Footer */

        .footer {
            text-align: center;

            color: #fff;

            margin-top: 24px;

            font-size: 14px;
        }

        .footer a {
            font-weight: 600;
        }

        .copyright {
            text-align: center;

            color: rgba(255, 255, 255, 0.7);

            font-size: 11px;

            margin-top: 18px;
        }

        /* Loading Spinner */

        .spinner {
            display: inline-block;

            width: 15px;
            height: 15px;

            margin-right: 7px;

            vertical-align: -2px;

            border: 2px solid rgba(79, 70, 229, 0.25);

            border-top-color: #4f46e5;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Mobile */

        @media (max-width: 480px) {
            .card {
                width: 100%;
                padding: 30px 25px;
            }

            h2 {
                font-size: 21px;
            }

            .social {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .row {
                gap: 15px;
                align-items: flex-start;
                flex-direction: column;
            }
        }

        /* Reduced motion */

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }

            .card,
            .login-btn,
            .social button {
                transition: none;
            }

            .spinner {
                animation: none;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="logo" aria-hidden="true">
            🔐
        </div>

        <h2>Welcome Back 👋</h2>

        <p class="subtitle">
            Sign in to continue the process
        </p>

        <form id="loginForm" novalidate>

            <!-- Email -->

            <div class="field">

                <span class="field-icon" aria-hidden="true">
                    📧
                </span>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    autocomplete="email"
                    aria-label="Email address"
                    aria-describedby="emailError"
                    required
                >

                <div
                    class="error-message"
                    id="emailError"
                    role="alert"
                ></div>

            </div>

            <!-- Password -->

            <div class="field">

                <span class="field-icon" aria-hidden="true">
                    🔒
                </span>

                <input
                    id="pwd"
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    aria-label="Password"
                    aria-describedby="passwordError"
                    required
                    minlength="6"
                >

                <button
                    type="button"
                    class="eye"
                    id="passwordToggle"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    👁️
                </button>

                <div
                    class="password-strength"
                    id="passwordStrength"
                    aria-live="polite"
                >

                    <div class="strength-bar">

                        <div
                            class="strength-progress"
                            id="strengthProgress"
                        ></div>

                    </div>

                    <span
                        class="strength-text"
                        id="strengthText"
                    >
                        Password strength
                    </span>

                </div>

                <div
                    class="caps-warning"
                    id="capsWarning"
                    role="alert"
                >
                    ⚠️ Caps Lock is ON
                </div>

                <div
                    class="error-message"
                    id="passwordError"
                    role="alert"
                ></div>

            </div>

            <!-- Options -->

            <div class="row">

                <label class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >

                    <span>
                        Remember me
                    </span>

                </label>

                <a href="#" id="forgotPassword">
                    Forgot Password?
                </a>

            </div>

            <!-- Buttons -->

            <div class="button-group">

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Sign In
                </button>

                <button
                    type="button"
                    class="clear-btn"
                    id="clearBtn"
                >
                    Clear
                </button>

            </div>

            <!-- Status -->

            <div
                class="message"
                id="statusMessage"
                role="status"
                aria-live="polite"
            ></div>

            <!-- Divider -->

            <div class="div">
                <span>OR</span>
            </div>

            <!-- Social Login -->

            <div class="social">

                <button
                    type="button"
                    id="googleLogin"
                >
                    🌐 Google
                </button>

                <button
                    type="button"
                    id="githubLogin"
                >
                    🐙 GitHub
                </button>

            </div>

            <!-- Sign Up -->

            <div class="footer">

                Don't have an account?

                <a href="#" id="createAccount">
                    Create an Account
                </a>

            </div>

            <div class="copyright">
                © 2026 Your Application. All rights reserved.
            </div>

        </form>

    </div>

    <script>
        /* ================================
           DOM Elements
        ================================= */

        const form =
            document.getElementById("loginForm");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("pwd");

        const passwordToggle =
            document.getElementById("passwordToggle");

        const loginBtn =
            document.getElementById("loginBtn");

        const clearBtn =
            document.getElementById("clearBtn");

        const strengthContainer =
            document.getElementById("passwordStrength");

        const strengthProgress =
            document.getElementById("strengthProgress");

        const strengthText =
            document.getElementById("strengthText");

        const capsWarning =
            document.getElementById("capsWarning");

        const statusMessage =
            document.getElementById("statusMessage");

        const emailError =
            document.getElementById("emailError");

        const passwordError =
            document.getElementById("passwordError");


        /* ================================
           Password Visibility
        ================================= */

        function togglePassword() {

            const isPassword =
                password.type === "password";

            password.type =
                isPassword ? "text" : "password";

            passwordToggle.textContent =
                isPassword ? "🙈" : "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                isPassword
                    ? "Hide password"
                    : "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                String(isPassword)
            );
        }

        passwordToggle.addEventListener(
            "click",
            togglePassword
        );


        /* ================================
           Password Strength
        ================================= */

        function updatePasswordStrength() {

            const value = password.value;

            if (!value) {

                strengthContainer.style.display =
                    "none";

                strengthProgress.style.width =
                    "0%";

                return;
            }

            strengthContainer.style.display =
                "block";

            let score = 0;

            if (value.length >= 6) {
                score++;
            }

            if (value.length >= 10) {
                score++;
            }

            if (/[A-Z]/.test(value)) {
                score++;
            }

            if (/[0-9]/.test(value)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(value)) {
                score++;
            }

            const percentage =
                score * 20;

            strengthProgress.style.width =
                percentage + "%";

            if (score <= 2) {

                strengthProgress.style.background =
                    "#ef4444";

                strengthText.textContent =
                    "Weak password";

            } else if (score <= 3) {

                strengthProgress.style.background =
                    "#f59e0b";

                strengthText.textContent =
                    "Medium password";

            } else {

                strengthProgress.style.background =
                    "#22c55e";

                strengthText.textContent =
                    "Strong password";
            }
        }

        password.addEventListener(
            "input",
            updatePasswordStrength
        );


        /* ================================
           Caps Lock Detection
        ================================= */

        function checkCapsLock(event) {

            if (
                event.getModifierState &&
                event.getModifierState("CapsLock")
            ) {

                capsWarning.style.display =
                    "block";

            } else {

                capsWarning.style.display =
                    "none";
            }
        }

        password.addEventListener(
            "keydown",
            checkCapsLock
        );

        password.addEventListener(
            "keyup",
            checkCapsLock
        );

        password.addEventListener(
            "blur",
            function() {
                capsWarning.style.display = "none";
            }
        );


        /* ================================
           Validation
        ================================= */

        function clearErrors() {

            email.classList.remove("error");

            password.classList.remove("error");

            emailError.textContent = "";

            passwordError.textContent = "";

            emailError.style.display = "none";

            passwordError.style.display = "none";
        }

        function validateForm() {

            clearErrors();

            let valid = true;

            if (!email.value.trim()) {

                email.classList.add("error");

                emailError.textContent =
                    "Please enter your email address.";

                emailError.style.display =
                    "block";

                valid = false;

            } else if (!email.validity.valid) {

                email.classList.add("error");

                emailError.textContent =
                    "Please enter a valid email address.";

                emailError.style.display =
                    "block";

                valid = false;
            }

            if (!password.value) {

                password.classList.add("error");

                passwordError.textContent =
                    "Please enter your password.";

                passwordError.style.display =
                    "block";

                valid = false;

            } else if (password.value.length < 6) {

                password.classList.add("error");

                passwordError.textContent =
                    "Password must contain at least 6 characters.";

                passwordError.style.display =
                    "block";

                valid = false;
            }

            if (!valid) {

                if (email.classList.contains("error")) {
                    email.focus();
                } else {
                    password.focus();
                }
            }

            return valid;
        }


        email.addEventListener(
            "input",
            function() {

                email.classList.remove("error");

                emailError.textContent = "";

                emailError.style.display = "none";
            }
        );

        password.addEventListener(
            "input",
            function() {

                password.classList.remove("error");

                passwordError.textContent = "";

                passwordError.style.display = "none";
            }
        );


        /* ================================
           Status Message
        ================================= */

        function showMessage(message, type) {

            statusMessage.textContent =
                message;

            statusMessage.className =
                "message " + type;

            statusMessage.style.display =
                "block";
        }


        function hideMessage() {

            statusMessage.style.display =
                "none";
        }


        /* ================================
           Clear Form
        ================================= */

        clearBtn.addEventListener(
            "click",
            function() {

                form.reset();

                clearErrors();

                hideMessage();

                strengthContainer.style.display =
                    "none";

                strengthProgress.style.width =
                    "0%";

                strengthProgress.style.background =
                    "#fff";

                capsWarning.style.display =
                    "none";

                password.type =
                    "password";

                passwordToggle.textContent =
                    "👁️";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Show password"
                );

                passwordToggle.setAttribute(
                    "aria-pressed",
                    "false"
                );

                loginBtn.disabled =
                    false;

                loginBtn.innerHTML =
                    "Sign In";
            }
        );


        /* ================================
           Sign In
        ================================= */

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                hideMessage();

                if (!validateForm()) {
                    return;
                }

                loginBtn.disabled =
                    true;

                loginBtn.innerHTML =
                    '<span class="spinner"></span>Signing In...';

                /*
                 * IMPORTANT:
                 *
                 * This is only a frontend demo.
                 *
                 * Replace the code below with your
                 * actual authentication API call.
                 *
                 * Example:
                 *
                 * const response = await fetch("/api/login", {
                 *     method: "POST",
                 *     headers: {
                 *         "Content-Type": "application/json"
                 *     },
                 *     body: JSON.stringify({
                 *         email: email.value,
                 *         password: password.value
                 *     })
                 * });
                 */

                try {

                    await new Promise(
                        resolve =>
                            setTimeout(resolve, 1500)
                    );

                    showMessage(
                        "Demo login completed. Connect this form to your backend for real authentication.",
                        "success"
                    );

                } catch (error) {

                    showMessage(
                        "Unable to sign in. Please try again.",
                        "error"
                    );

                } finally {

                    loginBtn.disabled =
                        false;

                    loginBtn.innerHTML =
                        "Sign In";
                }
            }
        );


        /* ================================
           Google Login
        ================================= */

        document
            .getElementById("googleLogin")
            .addEventListener(
                "click",
                function() {

                    showMessage(
                        "Google OAuth is not configured yet.",
                        "error"
                    );
                }
            );


        /* ================================
           GitHub Login
        ================================= */

        document
            .getElementById("githubLogin")
            .addEventListener(
                "click",
                function() {

                    showMessage(
                        "GitHub OAuth is not configured yet.",
                        "error"
                    );
                }
            );


        /* ================================
           Forgot Password
        ================================= */

        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    showMessage(
                        "Connect this link to your password-reset page.",
                        "error"
                    );
                }
            );


        /* ================================
           Create Account
        ================================= */

        document
            .getElementById("createAccount")
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();

                    showMessage(
                        "Connect this link to your registration page.",
                        "error"
                    );
                }
            );
    </script>

</body>
</html>
