<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern secure login page">

    <title>Modern Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #4f46e5, #06b6d4, #8b5cf6);
            background-size: 300% 300%;
            animation: backgroundMove 12s ease infinite;
        }

        @keyframes backgroundMove {
            0%, 100% { background-position: 0 50%; }
            50% { background-position: 100% 50%; }
        }

        .card {
            width: 420px;
            max-width: 100%;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            font-size: 34px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h1,
        .subtitle {
            text-align: center;
            color: #fff;
        }

        h1 {
            margin: 20px 0 8px;
            font-size: 24px;
            font-weight: 600;
        }

        .subtitle {
            margin-bottom: 30px;
            opacity: 0.9;
            font-size: 14px;
        }

        .field {
            position: relative;
            margin-bottom: 18px;
        }

        .field-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 15px 48px 15px 45px;
            border: 1px solid transparent;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            transition: background 0.2s, border-color 0.2s, outline 0.2s;
        }

        input::placeholder {
            color: #eee;
        }

        input:focus {
            outline: 2px solid rgba(255, 255, 255, 0.45);
            background: rgba(255, 255, 255, 0.23);
        }

        input:invalid:not(:placeholder-shown) {
            outline: 2px solid rgba(255, 120, 120, 0.7);
        }

        .eye {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            padding: 2px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            user-select: none;
            font-size: 17px;
        }

        .eye:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 5px;
        }

        .password-strength {
            display: none;
            margin-top: 8px;
        }

        .strength-bar {
            width: 100%;
            height: 5px;
            overflow: hidden;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
        }

        .strength-progress {
            width: 0;
            height: 100%;
            border-radius: 5px;
            background: #fff;
            transition: width 0.3s ease;
        }

        .strength-text {
            display: block;
            margin-top: 5px;
            color: rgba(255, 255, 255, 0.85);
            font-size: 11px;
        }

        .caps-warning {
            display: none;
            margin-top: 7px;
            color: #fff;
            font-size: 12px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            color: #fff;
            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            cursor: pointer;
        }

        .remember input {
            width: 15px;
            height: 15px;
            accent-color: #fff;
            cursor: pointer;
        }

        a {
            color: #fff;
            text-decoration: none;
            transition: 0.2s;
        }

        a:hover {
            text-decoration: underline;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .login-btn,
        .clear-btn {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
        }

        .login-btn {
            border: none;
            background: #fff;
            color: #4f46e5;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .clear-btn {
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .div {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #fff;
        }

        .div::before,
        .div::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .div span {
            padding: 0 12px;
            font-size: 13px;
        }

        .social {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .social button {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            transition: 0.25s;
        }

        .social button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(34, 197, 94, 0.25);
            color: #fff;
            text-align: center;
            font-size: 13px;
        }

        .footer {
            margin-top: 24px;
            color: #fff;
            text-align: center;
            font-size: 14px;
        }

        .footer a {
            font-weight: 600;
        }

        .copyright {
            margin-top: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
                padding: 30px 25px;
            }

            h1 {
                font-size: 21px;
            }

            .social {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }

            .card,
            .login-btn,
            .social button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="logo" aria-hidden="true">🔐</div>

        <h1>Welcome Back 👋</h1>

        <p class="subtitle">
            Sign in to continue the process
        </p>

        <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="field">

                <span class="field-icon" aria-hidden="true">📧</span>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Email"
                    autocomplete="email"
                    aria-label="Email address"
                    required
                >

            </div>

            <!-- Password -->
            <div class="field">

                <span class="field-icon" aria-hidden="true">🔒</span>

                <input
                    id="pwd"
                    name="password"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    aria-label="Password"
                    required
                    minlength="6"
                >

                <button
                    type="button"
                    class="eye"
                    id="passwordToggle"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    👁️
                </button>

                <div
                    class="password-strength"
                    id="passwordStrength"
                    aria-live="polite"
                >
                    <div class="strength-bar">
                        <div
                            class="strength-progress"
                            id="strengthProgress"
                        ></div>
                    </div>

                    <span
                        class="strength-text"
                        id="strengthText"
                    >
                        Password strength
                    </span>
                </div>

                <div
                    class="caps-warning"
                    id="capsWarning"
                    role="alert"
                >
                    ⚠️ Caps Lock is ON
                </div>

            </div>

            <!-- Options -->
            <div class="row">

                <label class="remember">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                    >
                    <span>Remember me</span>
                </label>

                <a href="#forgot-password" id="forgotPasswordLink">
                    Forgot Password?
                </a>

            </div>

            <!-- Buttons -->
            <div class="button-group">

                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >
                    Sign In
                </button>

                <button
                    type="button"
                    class="clear-btn"
                    id="clearBtn"
                >
                    Clear
                </button>

            </div>

            <!-- Status -->
            <div
                class="message"
                id="successMessage"
                role="status"
                aria-live="polite"
            >
                ✅ Sign-in successful!
            </div>

            <!-- Divider -->
            <div class="div" aria-hidden="true">
                <span>OR</span>
            </div>

            <!-- Social Login -->
            <div class="social">

                <button type="button" id="googleLogin">
                    🌐 Google
                </button>

                <button type="button" id="githubLogin">
                    🐙 GitHub
                </button>

            </div>

            <!-- Sign Up -->
            <div class="footer">

                Don't have an account?

                <a href="#create-account" id="createAccountLink">
                    Create an Account
                </a>

            </div>

            <div class="copyright">
                © 2026 Your Application. All rights reserved.
            </div>

        </form>

    </main>

    <script>
        "use strict";

        const form = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("pwd");
        const passwordToggle = document.getElementById("passwordToggle");

        const strengthContainer =
            document.getElementById("passwordStrength");

        const strengthProgress =
            document.getElementById("strengthProgress");

        const strengthText =
            document.getElementById("strengthText");

        const capsWarning =
            document.getElementById("capsWarning");

        const clearButton =
            document.getElementById("clearBtn");

        const loginButton =
            document.getElementById("loginBtn");

        const successMessage =
            document.getElementById("successMessage");

        /*
         * Password visibility
         */
        passwordToggle.addEventListener("click", () => {
            const shouldShow = password.type === "password";

            password.type = shouldShow ? "text" : "password";

            passwordToggle.textContent =
                shouldShow ? "🙈" : "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                shouldShow ? "Hide password" : "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                String(shouldShow)
            );
        });

        /*
         * Password strength
         */
        password.addEventListener("input", () => {
            const value = password.value;

            if (!value) {
                strengthContainer.style.display = "none";
                strengthProgress.style.width = "0";
                return;
            }

            strengthContainer.style.display = "block";

            let score = 0;

            if (value.length >= 6) score++;
            if (value.length >= 10) score++;
            if (/[A-Z]/.test(value)) score++;
            if (/[0-9]/.test(value)) score++;
            if (/[^A-Za-z0-9]/.test(value)) score++;

            const percentage = Math.min(score * 20, 100);

            strengthProgress.style.width =
                percentage + "%";

            if (score <= 2) {
                strengthText.textContent = "Weak password";
            } else if (score <= 3) {
                strengthText.textContent = "Medium password";
            } else {
                strengthText.textContent = "Strong password";
            }
        });

        /*
         * Caps Lock detection
         */
        password.addEventListener("keyup", (event) => {
            const capsLockOn =
                event.getModifierState &&
                event.getModifierState("CapsLock");

            capsWarning.style.display =
                capsLockOn ? "block" : "none";
        });

        /*
         * Clear form
         */
        clearButton.addEventListener("click", () => {
            form.reset();

            password.type = "password";

            passwordToggle.textContent = "👁️";

            passwordToggle.setAttribute(
                "aria-label",
                "Show password"
            );

            passwordToggle.setAttribute(
                "aria-pressed",
                "false"
            );

            strengthContainer.style.display = "none";
            strengthProgress.style.width = "0";
            capsWarning.style.display = "none";
            successMessage.style.display = "none";

            email.focus();
        });

        /*
         * Login form
         *
         * This is only a UI demonstration.
         * No credentials or API keys are stored in this file.
         */
        form.addEventListener("submit", (event) => {
            event.preventDefault();

            if (!email.checkValidity()) {
                email.focus();
                return;
            }

            if (!password.checkValidity()) {
                password.focus();
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = "Signing In...";
            successMessage.style.display = "none";

            window.setTimeout(() => {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In";
                successMessage.style.display = "block";
            }, 1500);
        });

        /*
         * Prevent placeholder navigation.
         * These are UI-only links until real routes are configured.
         */
        document
            .getElementById("forgotPasswordLink")
            .addEventListener("click", (event) => {
                event.preventDefault();
            });

        document
            .getElementById("createAccountLink")
            .addEventListener("click", (event) => {
                event.preventDefault();
            });

        /*
         * Social buttons are UI placeholders.
         * Real OAuth configuration should be handled by the backend
         * or the respective provider's secure authentication flow.
         */
        document
            .getElementById("googleLogin")
            .addEventListener("click", () => {
                successMessage.textContent =
                    "Google sign-in is not configured yet.";
                successMessage.style.display = "block";
            });

        document
            .getElementById("githubLogin")
            .addEventListener("click", () => {
                successMessage.textContent =
                    "GitHub sign-in is not configured yet.";
                successMessage.style.display = "block";
            });
    </script>

</body>
</html>
