name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr.diff

      - name: Call Zoho Catalyst AI review function
        id: review
        env:
          ENDPOINT: ${{ secrets.ENDPOINT }}
        run: |
          python3 << 'PYEOF' > parsed_endpoint.env
          import urllib.parse as up
          import os

          url = os.environ["ENDPOINT"]
          parsed = up.urlparse(url)

          domain = parsed.netloc.split(".")[-1]  # e.g. "com", "in", "eu"

          path_parts = parsed.path.strip("/").split("/")
          org_id = path_parts[1]
          channel_name = path_parts[5]

          query = up.parse_qs(parsed.query)
          zapikey = query.get("zapikey", [""])[0]

          print(f"domain={domain}")
          print(f"org_id={org_id}")
          print(f"channel_name={channel_name}")
          print(f"zapikey={zapikey}")
          PYEOF

          source parsed_endpoint.env

          ENC_DOMAIN=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$domain")
          ENC_ORG=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$org_id")
          ENC_CHANNEL=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$channel_name")
          ENC_ZAPIKEY=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$zapikey")

          RESPONSE=$(curl -s -X POST "${{ secrets.CATALYST_FUNCTION_URL }}?domain=${ENC_DOMAIN}&org_id=${ENC_ORG}&channel_name=${ENC_CHANNEL}&zapikey=${ENC_ZAPIKEY}" \
            -H "Content-Type: application/json" \
            --data-binary @<(jq -n \
              --arg diff "$(cat pr.diff)" \
              --arg repo "${{ github.repository }}" \
              --arg pr_number "${{ github.event.pull_request.number }}" \
              '{diff: $diff, repo: $repo, pr_number: $pr_number}'))

          echo "$RESPONSE" > response.json
          STATUS=$(echo "$RESPONSE" | jq -r '.status')
          COMMENT=$(echo "$RESPONSE" | jq -r '.comment // "No comment provided"')
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "comment<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
