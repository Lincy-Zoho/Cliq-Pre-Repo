name: Communicating with Catalyst

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  trigger_catalyst_function:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Call Zoho Catalyst Function
        env:
          CATALYST_FUNCTION_URL: ${{ secrets.CATALYST_FUNCTION_URL }}
          ENDPOINT: ${{ secrets.ENDPOINT }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          REQUEST_URL="${CATALYST_FUNCTION_URL:-${ENDPOINT:-}}"
          EVENT_PAYLOAD_PATH="${GITHUB_EVENT_PATH:-}"

          if [ -z "${REQUEST_URL:-}" ]; then
            echo "Both CATALYST_FUNCTION_URL and ENDPOINT secrets are missing or empty"
            exit 1
          fi

          if [ -z "${EVENT_PAYLOAD_PATH:-}" ] || [ ! -f "${EVENT_PAYLOAD_PATH}" ]; then
            echo "GITHUB_EVENT_PATH is missing or not a file"
            exit 1
          fi

          if [ -z "${ENDPOINT:-}" ]; then
            echo "ENDPOINT secret is missing or empty"
            exit 1
          fi

              cat > /tmp/ParseEndpoint.java <<'JAVA'
              import java.net.URI;
              import java.net.URLDecoder;
              import java.nio.charset.StandardCharsets;

              public class ParseEndpoint {
                private static String getQueryParam(String rawQuery, String key) {
                  if (rawQuery == null || rawQuery.isEmpty()) {
                    return "";
                  }
                  String prefix = key + "=";
                  for (String pair : rawQuery.split("&")) {
                    if (pair.startsWith(prefix)) {
                      return URLDecoder.decode(pair.substring(prefix.length()), StandardCharsets.UTF_8);
                    }
                  }
                  return "";
                }

                public static void main(String[] args) throws Exception {
                  String endpoint = System.getenv("ENDPOINT");
                  URI uri = new URI(endpoint);

                  String channel = getQueryParam(uri.getRawQuery(), "channel_unique_name");
                  if (channel.isEmpty()) {
                    channel = getQueryParam(uri.getRawQuery(), "channel_name");
                  }

                  if (channel.isEmpty()) {
                    String[] parts = uri.getPath().split("/");
                    for (int i = 0; i < parts.length; i++) {
                      if ("channelsbyname".equals(parts[i]) && i + 1 < parts.length) {
                        channel = URLDecoder.decode(parts[i + 1], StandardCharsets.UTF_8);
                        break;
                      }
                    }
                  }

                  channel = channel.replaceFirst("^\\*", "");
                  if (channel.isEmpty()) {
                    System.err.println("Unable to extract channel name from ENDPOINT");
                    System.exit(1);
                  }

                  System.out.print(channel);
                }
              }
              JAVA

              CHANNEL_IDENTIFIER=$(java /tmp/ParseEndpoint.java)

              ENC_CHANNEL=$(printf '%s' "$CHANNEL_IDENTIFIER" | jq -sRr @uri)

          if [ -n "${CATALYST_FUNCTION_URL:-}" ]; then
            if [[ "$CATALYST_FUNCTION_URL" == *\?* ]]; then
              REQUEST_URL="${CATALYST_FUNCTION_URL}&channel_unique_name=${ENC_CHANNEL}"
            else
              REQUEST_URL="${CATALYST_FUNCTION_URL}?channel_unique_name=${ENC_CHANNEL}"
            fi
          fi

          jq -n \
            --arg event "$EVENT_NAME" \
            --arg action "$EVENT_ACTION" \
            --arg actor "$ACTOR" \
            --arg repo "$REPO" \
            --arg ref "$REF" \
            --arg run_id "$RUN_ID" \
            --arg pr_number "$PR_NUMBER" \
            --arg label_name "$LABEL_NAME" \
            --slurpfile payload "$EVENT_PAYLOAD_PATH" \
            '{event: $event, action: $action, actor: $actor, repo: $repo, ref: $ref, run_id: $run_id, pr_number: $pr_number, label_name: $label_name, payload: $payload[0]}' \
            > catalyst_body.json

          curl --fail --show-error --location \
            --request POST "$REQUEST_URL" \
            --header "Content-Type: application/json" \
            --data @catalyst_body.json
